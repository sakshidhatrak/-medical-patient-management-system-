spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medimanage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8091

app:
  jwt:
    secret: dev-secret-key-change-me-in-production-use-at-least-64-chars-long
    expiration-ms: 86400000

  upload-dir: ./uploads

  cloudinary:
    cloud-name: ""
    api-key: ""
    api-secret: ""
    folder-prefix: medimanage

  cors:
    allowed-origins: "*"

logging:
  level:
    root: INFO
    com.medimanage: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  charset:
    console: UTF-8
